name: Firestore security regression
on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'tests/firestore.security.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.github/workflows/firestore-security.yml'
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npx firebase-tools@latest emulators:exec --project demo-union-security --only firestore "npm run test:rules"
      - run: npm run lint
      - run: npm test
      - run: npm run build
