name: Remaining Express API and Backup authorization

on:
  pull_request:
    paths:
      - 'server.ts'
      - 'src/App.tsx'
      - 'src/middleware/**'
      - 'tests/remaining-private-api-smoke.test.mjs'
      - '.github/workflows/remaining-api-security-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remaining-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  private-route-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript and production bundle
        run: |
          npm run lint
          npm run build
      - name: Verify anonymous/legacy-key bypass denied on localhost
        env:
          NODE_ENV: production
          GOOGLE_API_KEY: ''
          GEMINI_API_KEY: ''
          FIREBASE_AUTH_EMULATOR_HOST: ''
        run: node --test tests/remaining-private-api-smoke.test.mjs
