name: Quality, security and build CI

# No paths filter: a required check must not disappear for a PR.
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, application tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript type-check
        run: npm run lint
      - name: Application security utility regression tests
        run: node --experimental-strip-types --test tests/security-utils.test.mjs
      - name: Vite and Express bundle
        run: npm run build
      - name: Verify backend build output
        run: test -s dist/server.cjs

  eslint:
    name: ESLint security patterns
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install exact top-level ESLint packages in isolated directory
        run: npm install --prefix .ci/eslint --no-save --no-package-lock --ignore-scripts --no-audit --no-fund eslint@9.39.1 @typescript-eslint/parser@8.46.3
      - name: Lint TypeScript, TSX and regression tests
        run: ./.ci/eslint/node_modules/.bin/eslint --config eslint.config.mjs src server.ts worker.ts tests

  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Audit production packages against npm registry advisories
        run: npm audit --omit=dev --audit-level=high --no-fund

  firestore-baseline:
    name: Firestore deny-by-default policy guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Reject legacy broad client access rules
        run: node --test tests/firestore-policy.test.mjs
