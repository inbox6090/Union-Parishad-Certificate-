name: npm dependency and build CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'server.ts'
      - 'worker.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'index.html'
      - 'public/**'
      - '.github/workflows/npm-build-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: npm ci / TypeScript / Vite and Express build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Require committed lockfile
        run: test -s package-lock.json
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run lint
      - name: Build frontend and backend
        run: npm run build
      - name: Verify backend bundle
        run: test -s dist/server.cjs
