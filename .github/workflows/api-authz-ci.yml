name: Express API authorization regression tests

on:
  pull_request:
    paths:
      - 'server.ts'
      - 'src/middleware/**'
      - 'src/lib/apiAuth.ts'
      - 'src/components/ApplicationQueue.tsx'
      - 'src/components/ApplicationStatusLookup.tsx'
      - 'src/components/VerificationPortal.tsx'
      - 'tests/api-authz.test.ts'
      - 'tests/api-routes-smoke.test.mjs'
      - '.github/workflows/api-authz-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-authz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install committed dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run authorization and privacy unit tests without credentials
        run: node --import tsx --test tests/api-authz.test.ts
      - name: TypeScript and build checks
        run: |
          npm run lint
          npm run build
      - name: Start isolated local server and check unauthorized HTTP responses
        env:
          NODE_ENV: production
          FIREBASE_AUTH_EMULATOR_HOST: ''
          GOOGLE_API_KEY: ''
          GEMINI_API_KEY: ''
        run: node --test tests/api-routes-smoke.test.mjs
